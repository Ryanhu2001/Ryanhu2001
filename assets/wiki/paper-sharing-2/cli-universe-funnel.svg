<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">CLI-Universe 的五阶段过滤漏斗</title>
  <desc id="desc">从全部候选到最终保留 33.6% 的逐阶段过滤：想法过滤、蓝图验证、环境构建、任务验证。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f4"/>
      <stop offset="1" stop-color="#f0ece3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5d5142" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 44px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #191714; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #655e55; }
      .stage { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #1f1c18; }
      .pct { font: 800 30px "SF Mono", Menlo, monospace; fill: #ffffff; }
      .drop { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #a04a44; }
      .foot { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #655e55; }
    </style>
  </defs>

  <rect width="1600" height="560" rx="36" fill="url(#bg)"/>
  <text class="title" x="80" y="86">质量 &gt; 数量：五阶段漏斗只留下 33.6%</text>
  <text class="subtitle" x="82" y="126">每个保留样本都要求“真的有东西可学”——无提示失败、有提示成功、测试 Fail-to-Pass</text>

  <!-- Funnel bars: width proportional to retention, all left-aligned at x=80; scale 1200px = 100% -->
  <g filter="url(#shadow)">
    <rect x="80" y="176" width="1200" height="56" rx="12" fill="#8a9aa8"/>
    <rect x="80" y="248" width="840" height="56" rx="12" fill="#8c78bd"/>
    <rect x="80" y="320" width="672" height="56" rx="12" fill="#5f8fb3"/>
    <rect x="80" y="392" width="504" height="56" rx="12" fill="#d9a84e"/>
    <rect x="80" y="464" width="403" height="56" rx="12" fill="#5b9670"/>
  </g>

  <text class="pct" x="104" y="214">100%</text>
  <text class="stage" x="1300" y="212">所有候选（分类法锚点头脑风暴）</text>

  <text class="pct" x="104" y="286">70.0%</text>
  <text class="stage" x="940" y="284">想法过滤后</text>
  <text class="drop" x="1160" y="284">−30% 被拒绝的想法</text>

  <text class="pct" x="104" y="358">56.0%</text>
  <text class="stage" x="772" y="356">蓝图验证后</text>
  <text class="drop" x="992" y="356">−14% 无效蓝图</text>

  <text class="pct" x="104" y="430">42.0%</text>
  <text class="stage" x="604" y="428">环境构建后</text>
  <text class="drop" x="824" y="428">−14% 冒烟测试失败</text>

  <text class="pct" x="104" y="502">33.6%</text>
  <text class="stage" x="503" y="500">最终保留</text>
  <text class="drop" x="660" y="500">−8.4% Fail-to-Pass 过滤</text>
</svg>
