<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">11 个 Agent benchmark 的主状态与评分范式</title>
  <desc id="desc">将 benchmark 按最终答案或交付物、工具轨迹、应用环境状态三种主状态来源分组，并标注确定性、混合与 LLM 评分方式。</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#201D1B" flood-opacity=".11"/>
    </filter>
  </defs>
  <rect width="1440" height="900" rx="30" fill="#F4EFE5"/>
  <text x="70" y="76" fill="#26221F" font-family="Inter, Noto Sans SC, sans-serif" font-size="34" font-weight="700">11 个 benchmark：先问“结果状态在哪里”，再问“怎么打分”</text>
  <text x="70" y="114" fill="#6D655E" font-family="Inter, Noto Sans SC, sans-serif" font-size="18">同一项目可能跨列；这里放的是主导其最终判定的状态权威。</text>

  <g font-family="Inter, Noto Sans SC, sans-serif">
    <rect x="68" y="160" width="404" height="616" rx="24" fill="#FFF8ED" stroke="#C9AE86" stroke-width="2"/>
    <text x="100" y="207" fill="#8B572F" font-size="24" font-weight="700">A. 最终答案 / 交付物</text>
    <text x="100" y="239" fill="#685D54" font-size="16">CSV、文档、表格、数字答案是权威结果</text>

    <rect x="100" y="282" width="340" height="90" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="124" y="317" fill="#26221F" font-size="20" font-weight="700">Agents’ Last Exam</text>
    <text x="124" y="346" fill="#6A625C" font-size="15">task-specific · 多为确定性/混合</text>

    <rect x="100" y="394" width="340" height="90" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="124" y="429" fill="#26221F" font-size="20" font-weight="700">JobBench</text>
    <text x="124" y="458" fill="#A14C46" font-size="15">weighted rubric · LLM judge</text>

    <rect x="100" y="506" width="340" height="90" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="124" y="541" fill="#26221F" font-size="20" font-weight="700">OfficeQA</text>
    <text x="124" y="570" fill="#4E829E" font-size="15">numeric/text reward · 确定性</text>

    <rect x="100" y="618" width="340" height="126" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="124" y="653" fill="#26221F" font-size="20" font-weight="700">SpreadsheetBench 2</text>
    <text x="124" y="682" fill="#4E829E" font-size="15">cell diff · 确定性</text>
    <text x="124" y="710" fill="#A14C46" font-size="15">Visualization · VLM checklist</text>

    <rect x="518" y="160" width="404" height="616" rx="24" fill="#F0F6F3" stroke="#95B4A0" stroke-width="2"/>
    <text x="550" y="207" fill="#3F7457" font-size="24" font-weight="700">B. 工具轨迹 / 信息覆盖</text>
    <text x="550" y="239" fill="#5D6961" font-size="16">调用了什么、读到了什么、最终 claim 是否覆盖</text>

    <rect x="550" y="282" width="340" height="106" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="574" y="317" fill="#26221F" font-size="20" font-weight="700">MCP-Atlas</text>
    <text x="574" y="346" fill="#A14C46" font-size="15">ground-truth claims</text>
    <text x="574" y="370" fill="#A14C46" font-size="15">LLM coverage judge</text>

    <rect x="550" y="414" width="340" height="132" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="574" y="449" fill="#26221F" font-size="20" font-weight="700">Claw-Eval</text>
    <text x="574" y="478" fill="#6A625C" font-size="15">Safety gate × Completion</text>
    <text x="574" y="503" fill="#6A625C" font-size="15">× Robustness · 混合评分</text>
    <text x="574" y="528" fill="#B26B32" font-size="15">Pass³：三次全过</text>

    <rect x="550" y="572" width="340" height="142" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="574" y="607" fill="#26221F" font-size="20" font-weight="700">Toolathlon</text>
    <text x="574" y="636" fill="#6A625C" font-size="15">600+ tools · long horizon</text>
    <text x="574" y="661" fill="#4E829E" font-size="15">task-specific hidden evaluator</text>
    <text x="574" y="686" fill="#A14C46" font-size="15">跨本地与远程状态</text>

    <rect x="968" y="160" width="404" height="616" rx="24" fill="#EEF4F8" stroke="#8CAEC1" stroke-width="2"/>
    <text x="1000" y="207" fill="#3D708B" font-size="24" font-weight="700">C. 应用 / 环境终态</text>
    <text x="1000" y="239" fill="#59676F" font-size="16">WorldState、SaaS 数据库或 VM 是事实源</text>

    <rect x="1000" y="282" width="340" height="90" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="1024" y="317" fill="#26221F" font-size="20" font-weight="700">AutomationBench</text>
    <text x="1024" y="346" fill="#4E829E" font-size="15">WorldState assertions · 确定性</text>

    <rect x="1000" y="394" width="340" height="90" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="1024" y="429" fill="#26221F" font-size="20" font-weight="700">MCPMark</text>
    <text x="1024" y="458" fill="#4E829E" font-size="15">service verifier · 多为确定性</text>

    <rect x="1000" y="506" width="340" height="90" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="1024" y="541" fill="#26221F" font-size="20" font-weight="700">SaaS-Bench</text>
    <text x="1024" y="570" fill="#A14C46" font-size="15">DB/API checks + LLM/VLM</text>

    <rect x="1000" y="618" width="340" height="126" rx="17" fill="#FFFFFF" filter="url(#s)"/>
    <text x="1024" y="653" fill="#26221F" font-size="20" font-weight="700">OSWorld V2</text>
    <text x="1024" y="682" fill="#4E829E" font-size="15">VM snapshot + task class</text>
    <text x="1024" y="710" fill="#6A625C" font-size="15">setup 与 evaluate 同源</text>
  </g>

  <rect x="244" y="812" width="952" height="50" rx="16" fill="#2C2927"/>
  <text x="720" y="844" text-anchor="middle" fill="#F5EFE5" font-family="Inter, Noto Sans SC, sans-serif" font-size="17">
    “确定性 grader”不等于“确定性 benchmark”：外部服务、并发、镜像、时间和 Resume 都可能改变输入状态。
  </text>
</svg>
