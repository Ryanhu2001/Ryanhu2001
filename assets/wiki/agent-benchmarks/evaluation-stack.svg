<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Agent benchmark 的五层评测栈</title>
  <desc id="desc">任务契约经过环境与工具交给 Agent，Agent 改变权威状态并产生轨迹与交付物，隐藏评分器在信任边界外读取结果，最后写入带版本身份的运行账本。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#2D2926" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#423D38"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B94B45"/>
    </marker>
  </defs>
  <rect width="1440" height="860" rx="30" fill="#F4EFE5"/>
  <text x="72" y="78" fill="#26221F" font-family="Inter, Noto Sans SC, sans-serif" font-size="34" font-weight="700">Agent benchmark 不是一道题，而是一条带信任边界的状态流水线</text>
  <text x="72" y="116" fill="#6D655E" font-family="Inter, Noto Sans SC, sans-serif" font-size="18">真正被比较的是：模型 × Harness × 工具协议 × 环境镜像 × Grader × Resume 语义</text>

  <rect x="68" y="170" width="250" height="188" rx="22" fill="#FFF9EF" stroke="#C9B89F" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="105" cy="210" r="17" fill="#CF7D52"/>
  <text x="137" y="218" fill="#26221F" font-family="Inter, Noto Sans SC, sans-serif" font-size="23" font-weight="700">1. Task Contract</text>
  <text x="94" y="260" fill="#4D4742" font-family="Inter, Noto Sans SC, sans-serif" font-size="17">
    <tspan x="94" dy="0">Prompt / 初始状态 / 可用工具</tspan>
    <tspan x="94" dy="30">输出格式 / 时间与步数预算</tspan>
    <tspan x="94" dy="30">task_id + contract hash</tspan>
  </text>

  <rect x="376" y="170" width="250" height="188" rx="22" fill="#F1F6F2" stroke="#9CB7A3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="413" cy="210" r="17" fill="#4F8A69"/>
  <text x="445" y="218" fill="#26221F" font-family="Inter, Noto Sans SC, sans-serif" font-size="23" font-weight="700">2. Agent Surface</text>
  <text x="402" y="260" fill="#4D4742" font-family="Inter, Noto Sans SC, sans-serif" font-size="17">
    <tspan x="402" dy="0">LLM loop / GUI / MCP / Shell</tspan>
    <tspan x="402" dy="30">可见文件与服务凭据</tspan>
    <tspan x="402" dy="30">轨迹、错误、退出原因</tspan>
  </text>

  <rect x="684" y="170" width="286" height="188" rx="22" fill="#EEF4F8" stroke="#8CAEC1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="721" cy="210" r="17" fill="#4E829E"/>
  <text x="753" y="218" fill="#26221F" font-family="Inter, Noto Sans SC, sans-serif" font-size="23" font-weight="700">3. State Authority</text>
  <text x="710" y="260" fill="#4D4742" font-family="Inter, Noto Sans SC, sans-serif" font-size="17">
    <tspan x="710" dy="0">WorldState / SaaS DB / 文件</tspan>
    <tspan x="710" dy="30">VM snapshot / 远程服务</tspan>
    <tspan x="710" dy="30">结果必须从这里读取</tspan>
  </text>

  <line x1="318" y1="264" x2="368" y2="264" stroke="#423D38" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="626" y1="264" x2="676" y2="264" stroke="#423D38" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1028" y="170" width="344" height="188" rx="22" fill="#FFF2F0" stroke="#D48B86" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1065" cy="210" r="17" fill="#B94B45"/>
  <text x="1097" y="218" fill="#26221F" font-family="Inter, Noto Sans SC, sans-serif" font-size="23" font-weight="700">4. Hidden Grader</text>
  <text x="1054" y="260" fill="#4D4742" font-family="Inter, Noto Sans SC, sans-serif" font-size="17">
    <tspan x="1054" dy="0">Reference / Assertions / Rubric</tspan>
    <tspan x="1054" dy="30">确定性检查、LLM/VLM judge</tspan>
    <tspan x="1054" dy="30">必须 fail closed，且晚于 Agent 注入</tspan>
  </text>

  <line x1="970" y1="264" x2="1020" y2="264" stroke="#B94B45" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowRed)"/>
  <text x="978" y="239" fill="#B94B45" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="700">TRUST BOUNDARY</text>

  <path d="M 826 358 C 826 425, 1200 410, 1200 470" fill="none" stroke="#B94B45" stroke-width="3" marker-end="url(#arrowRed)"/>
  <path d="M 500 358 C 500 438, 608 418, 608 470" fill="none" stroke="#6D655E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="196" y="470" width="1048" height="244" rx="26" fill="#292725" filter="url(#shadow)"/>
  <text x="242" y="520" fill="#F9F3E9" font-family="Inter, Noto Sans SC, sans-serif" font-size="25" font-weight="700">5. Run Ledger：一次结果必须能回答“到底运行了什么”</text>
  <line x1="242" y1="544" x2="1198" y2="544" stroke="#56514D" stroke-width="1"/>

  <g font-family="Inter, Noto Sans SC, sans-serif">
    <rect x="242" y="576" width="198" height="92" rx="15" fill="#3B3835"/>
    <text x="264" y="608" fill="#D6A17E" font-size="16" font-weight="700">IDENTITY</text>
    <text x="264" y="638" fill="#F4EFE5" font-size="16">task / contract hash</text>

    <rect x="460" y="576" width="198" height="92" rx="15" fill="#3B3835"/>
    <text x="482" y="608" fill="#9FC4AB" font-size="16" font-weight="700">ENVIRONMENT</text>
    <text x="482" y="638" fill="#F4EFE5" font-size="16">image / data / services</text>

    <rect x="678" y="576" width="198" height="92" rx="15" fill="#3B3835"/>
    <text x="700" y="608" fill="#9DC0D3" font-size="16" font-weight="700">TRAJECTORY</text>
    <text x="700" y="638" fill="#F4EFE5" font-size="16">actions / outcome / exit</text>

    <rect x="896" y="576" width="302" height="92" rx="15" fill="#3B3835"/>
    <text x="918" y="608" fill="#E2A09A" font-size="16" font-weight="700">VERDICT</text>
    <text x="918" y="638" fill="#F4EFE5" font-size="16">grader digest / score / retry lineage</text>
  </g>

  <rect x="196" y="752" width="1048" height="48" rx="15" fill="#E7DED0"/>
  <text x="720" y="783" text-anchor="middle" fill="#4A443F" font-family="Inter, Noto Sans SC, sans-serif" font-size="17">
    如果 Resume 只看“目录非空”，或并发任务共享同一状态，这条流水线记录的就不再是同一个实验。
  </text>
</svg>
