<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc">
  <title id="title">ExpRL reference-guided RL loop with Outcome and Process rewards</title>
  <desc id="desc">Self-made diagram: the reference solution is hidden from the policy and only used by the LLM judge, which produces either an outcome-level score or per-segment process advantages; the primed policy then enters Stage-II sparse-reward RL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4f5f66"/></marker>
    <style>
      .bg { fill: #fbf6ea; }
      .box { fill: #fffaf0; stroke: #b89a62; stroke-width: 2; }
      .box2 { fill: #f6f8fb; stroke: #7893b0; stroke-width: 2; }
      .box3 { fill: #f7fbf7; stroke: #6f9b7b; stroke-width: 2; }
      .box4 { fill: #fdf3f3; stroke: #b0797c; stroke-width: 2; }
      .h1 { fill: #1f2428; font-family: Inter, Arial, sans-serif; font-size: 26px; font-weight: 700; }
      .h2 { fill: #1f2428; font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .small { fill: #4f5459; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 500; }
      .mono { fill: #35424a; font-family: "SF Mono", Menlo, monospace; font-size: 14px; }
      .line { stroke: #4f5f66; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .hidden { stroke-dasharray: 8 8; }
      .stage { fill: none; stroke: #9aa4ab; stroke-width: 1.5; stroke-dasharray: 4 6; }
    </style>
  </defs>
  <rect class="bg" width="1240" height="700"/>
  <text class="h1" x="48" y="52">ExpRL：reference 只进 judge 的上下文，不进 policy 的上下文</text>
  <text class="small" x="48" y="82">actor 始终 on-policy 采样；reference 只用来构造 problem-specific rubric，给 partial progress 打分</text>

  <rect class="stage" x="36" y="104" width="880" height="470" rx="14"/>
  <text class="small" x="52" y="130" style="font-weight:700; fill:#6b747c">Stage-I：ExpRL mid-training（G=10 rollouts，230 steps，KL 正则）</text>

  <rect class="box" x="60" y="170" width="190" height="96" rx="14"/>
  <text class="h2" x="82" y="208">Problem x</text>
  <text class="small" x="82" y="236">hard QA pair (InT+POPE)</text>

  <rect class="box2" x="320" y="160" width="230" height="116" rx="14"/>
  <text class="h2" x="344" y="198">Policy rollout y</text>
  <text class="small" x="344" y="226">temp 0.8, max 16,384 tok</text>
  <text class="small" x="344" y="250">看不到 reference</text>

  <rect class="box" x="640" y="140" width="240" height="90" rx="14"/>
  <text class="h2" x="664" y="176">Reference y*</text>
  <text class="small" x="664" y="204">hidden from actor</text>

  <rect class="box3" x="640" y="270" width="240" height="100" rx="14"/>
  <text class="h2" x="664" y="306">LLM judge</text>
  <text class="small" x="664" y="332">verify, not solve</text>
  <text class="small" x="664" y="354">score 1..5 → (s-1)/4</text>

  <rect class="box3" x="320" y="410" width="260" height="130" rx="14"/>
  <text class="h2" x="342" y="446">ExpRL-Outcome</text>
  <text class="small" x="342" y="472">整条 trace 一个分数</text>
  <text class="mono" x="342" y="496">R = s(x, y, y*)</text>
  <text class="small" x="342" y="520">GRPO-style batch 归一化</text>

  <rect class="box3" x="620" y="410" width="280" height="130" rx="14"/>
  <text class="h2" x="642" y="446">ExpRL-Process</text>
  <text class="small" x="642" y="472">按 ### 切 prefix，逐段打分</text>
  <text class="mono" x="642" y="496">A_t = s_t - s_(t-1)</text>
  <text class="small" x="642" y="520">REINFORCE，无 group norm</text>

  <rect class="box4" x="960" y="240" width="240" height="180" rx="14"/>
  <text class="h2" x="984" y="278">Stage-II</text>
  <text class="small" x="984" y="306">sparse-reward GRPO</text>
  <text class="small" x="984" y="330">binary 0/1 final answer</text>
  <text class="small" x="984" y="354">去掉 reference，500 steps</text>
  <text class="small" x="984" y="390" style="font-weight:700">primed coverage 在这里兑现</text>

  <path class="line" d="M250 218 H312"/>
  <path class="line" d="M550 218 C600 218 610 300 632 316"/>
  <path class="line hidden" d="M760 230 V262"/>
  <path class="line" d="M700 370 C640 392 540 390 480 404"/>
  <path class="line" d="M780 370 V402"/>
  <path class="line" d="M440 540 C420 590 350 580 340 284"/>
  <path class="line" d="M916 330 H952"/>
  <text class="small" x="785" y="252">仅评分用</text>
  <text class="small" x="150" y="600">reward 回流更新 policy：把概率质量推向有 partial progress 的推理路径</text>
  <text class="small" x="48" y="660">自制示意 · 依据 ExpRL (arXiv:2606.17024) Figure 1 与 Section 3 重画：关键在于 reference 与 policy 上下文的分离，以及 Outcome / Process 两种 reward 粒度</text>
</svg>
