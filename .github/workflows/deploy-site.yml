name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "**.html"
      - "**.json"
      - "_config.yml"
      - "_data/**"
      - "_includes/**"
      - "_layouts/**"
      - "_news/**"
      - "scripts/**"
      - "assets/**"
      - "papermod/**"
      - "diagrams/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "2.4.22"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - name: Install pinned Hugo
        env:
          HUGO_VERSION: "0.165.0"
          HUGO_SHA256: "5c3a37a5450b3e386e5b75a87a790fea2d04a796d75e171216c80ef48a32b432"
        run: |
          mkdir -p "${RUNNER_TEMP}/hugo-bin"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          printf '%s  %s\n' "${HUGO_SHA256}" "${RUNNER_TEMP}/hugo.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo-bin" hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"
      - run: npm run build
      - run: touch _site/.nojekyll

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy site [skip deploy]"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
