name: Update GitHub contribution snake

on:
  schedule:
    # Daily at 09:23 Asia/Shanghai (01:23 UTC).
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Generate mint contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            .github/profile/github-snake-dark.svg?palette=github-dark&color_snake=%23a6e3df&color_dots=%23161b22,%23244b50,%23427c7d,%2376b8b4,%23b8eee3
            .github/profile/github-snake.svg?palette=github-light&color_snake=%232d7f78&color_dots=%23ebedf0,%23cde7e1,%238fc5b8,%23529d8e,%232b7369

      - name: Validate the animations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          images = []
          for name in ("github-snake-dark.svg", "github-snake.svg"):
              content = (Path(".github/profile") / name).read_bytes()
              root = ET.fromstring(content)
              assert root.tag == "{http://www.w3.org/2000/svg}svg"
              assert len(content) > 10_000 and b"NaN" not in content
              assert b"@keyframes" in content, "Missing snake animation"
              images.append(content)
          assert images[0] != images[1], "Expected distinct dark and light palettes"
          PY

      - name: Publish the updated animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/profile/github-snake-dark.svg .github/profile/github-snake.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh GitHub contribution snake [skip deploy]"
          git pull --rebase origin main
          git push origin HEAD:main
