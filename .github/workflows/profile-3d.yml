name: Update 3D contribution city

on:
  schedule:
    # Daily at 09:23 Asia/Shanghai (01:23 UTC).
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Generate the contribution city
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile/contributions-3d-settings.json

      - name: Validate and install SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path("profile-3d-contrib/profile-night-view.svg")
          content = source.read_bytes()
          root = ET.fromstring(content)
          assert root.tag == "{http://www.w3.org/2000/svg}svg", "Expected an SVG"
          assert root.get("viewBox") == "0 0 1280 850", "Unexpected dimensions"
          assert len(content) > 10_000, "Contribution SVG is incomplete"
          assert b"NaN" not in content, "Contribution SVG contains invalid values"
          Path(".github/profile/contributions-3d.svg").write_bytes(content)
          PY

      - name: Publish the updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/profile/contributions-3d.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh 3D contribution city [skip deploy]"
          git pull --rebase origin main
          git push origin HEAD:main
